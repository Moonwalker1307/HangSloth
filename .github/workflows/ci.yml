name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the older run of it pointless, so it is cancelled. Every run on
# main gets its own group, so none of them is cancelled or dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet build -c Release
      # The DeadlockLab database scenarios start PostgreSQL and SQL Server with Testcontainers. Linux runners
      # have Docker, so there they must run; Windows runners can't run Linux containers and skip them.
      - id: test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory TestResults
        env:
          HANGSLOTH_REQUIRE_DB: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          HANGSLOTH_REQUIRE_SQLSERVER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - uses: actions/upload-artifact@v7
        if: failure() && steps.test.conclusion == 'failure'
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
      - run: dotnet pack src/HangSloth.Cli -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
      # Install the package the way a user would and run it once, so a broken package is noticed.
      - name: Install the packed tool
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(basename artifacts/HangSloth.*.nupkg .nupkg)
          # Only the folder with the package just built is a source, so a published package of the same
          # version on nuget.org can't be tested by mistake.
          cfg="$RUNNER_TEMP/nuget-packed-only.config"
          printf '<configuration><packageSources><clear /><add key="packed" value="%s" /></packageSources></configuration>\n' "$(pwd -W 2>/dev/null || pwd)/artifacts" > "$cfg"
          dotnet tool install HangSloth --tool-path tool --configfile "$cfg" --version "${pkg#HangSloth.}"
          ./tool/hangsloth --version
      # Take a dump of the sample app with the packed tool, analyze that dump, and check the explanation.
      - name: Analyze a hung sample with the packed tool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dotnet samples/HangApp/bin/Release/net10.0/HangApp.dll sync-over-async > app.log 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true' EXIT
          for _ in $(seq 100); do grep -q '^READY$' app.log && break; sleep 0.3; done
          grep -q '^READY$' app.log || { cat app.log; exit 1; }
          code=0
          ./tool/hangsloth "$app" --keep-dump smoke.dmp --no-color > live.txt || code=$?
          cat live.txt
          test "$code" -eq 2
          kill "$app"
          code=0
          ./tool/hangsloth smoke.dmp --no-color > dump.txt || code=$?
          cat dump.txt
          test "$code" -eq 2
          grep -q 'Deadlock: sync-over-async' dump.txt
          grep -q 'OrderController.cs:10' dump.txt
      # `$!` in Git Bash is not the Windows process id, so this one is PowerShell.
      - name: Analyze a hung sample with the packed tool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hangsloth = Join-Path $PWD 'tool/hangsloth.exe'
          $app = Start-Process dotnet -ArgumentList 'samples/HangApp/bin/Release/net10.0/HangApp.dll', 'sync-over-async' -PassThru -RedirectStandardOutput app.log -RedirectStandardError app.err
          try {
            $ready = $false
            for ($i = 0; $i -lt 100 -and -not $ready; $i++) {
              Start-Sleep -Milliseconds 300
              $ready = [bool](Select-String -Path app.log -Pattern '^READY$' -Quiet -ErrorAction SilentlyContinue)
            }
            if (-not $ready) { Get-Content app.log, app.err; throw 'The sample did not become ready.' }
            $live = & $hangsloth $app.Id --keep-dump smoke.dmp --no-color 2>&1 | Out-String
            $liveCode = $LASTEXITCODE
            Write-Host $live
            if ($liveCode -ne 2) { throw "Live analysis exited with $liveCode, expected 2." }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          $dump = & $hangsloth smoke.dmp --no-color 2>&1 | Out-String
          $dumpCode = $LASTEXITCODE
          Write-Host $dump
          if ($dumpCode -ne 2) { throw "Dump analysis exited with $dumpCode, expected 2." }
          if ($dump -notmatch 'Deadlock: sync-over-async') { throw 'The dump report does not explain the sync-over-async deadlock.' }
          if ($dump -notmatch 'OrderController\.cs:10') { throw 'The dump report has no file and line.' }
          # Every check above throws on failure. The last native command (hangsloth) exited 2 on purpose, and pwsh
          # would make that the exit code of the step.
          exit 0
