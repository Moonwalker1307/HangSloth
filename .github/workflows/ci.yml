name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet build -c Release
      # The DeadlockLab database scenarios start PostgreSQL and SQL Server with Testcontainers. Linux runners
      # have Docker, so there they must run; Windows runners can't run Linux containers and skip them.
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
        env:
          HANGSLOTH_REQUIRE_DB: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          HANGSLOTH_REQUIRE_SQLSERVER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - run: dotnet pack src/HangSloth.Cli -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
